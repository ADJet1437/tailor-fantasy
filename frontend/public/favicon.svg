    <path d="M33 34 C39 39, 47 45, 45 52 C43 58, 35 57, 32.5 47 C31.7 43, 32 37 33 34 Z"/>
  </g>

  <!-- body + antennae -->
  <path d="M32 24 C33.4 24, 34 25.4, 34 27 L34 45 C34 47.4, 33.1 49, 32 49
           C30.9 49, 30 47.4, 30 45 L30 27 C30 25.4, 30.6 24, 32 24 Z" fill="#e4c694"/>
