server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # long-lived caching for fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routing: /privacy, /product/:id etc. must fall back to index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
