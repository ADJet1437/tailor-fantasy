name: tailorfantasy

# Local development. Values come from .env at the repo root (see .env.example);
# the :- defaults keep `docker compose up` working without one.
services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    volumes:
      # source mounted for hot reload; the anonymous volume keeps the image's
      # node_modules from being shadowed by the host directory
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - tailorfantasy

  tailorfantasy:
    build: ./backend
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      # Inside the network the database is reachable as `db`, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nailart}:${POSTGRES_PASSWORD:-nailart}@db:5432/${POSTGRES_DB:-nailart}
      MEDIA_DIR: /app/media
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
    volumes:
      # bind-mounted so regenerating images needs no image rebuild
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      # 5432 is taken by talosy-backend-db-1, 5444 by play8-db
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nailart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nailart}
      POSTGRES_DB: ${POSTGRES_DB:-nailart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nailart} -d ${POSTGRES_DB:-nailart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
